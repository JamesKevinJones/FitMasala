org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Left off deliberately: Hilt's aggregating task plus KSP is the combination most
# likely to produce a confusing first-sync failure. Turn it on once the build is
# green and you want the speed.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Pin the build JDK.
#
# Studio Quail's bundled JBR is 25, which Gradle 8.x cannot parse - every task
# fails with a bare `* What went wrong:` / `25.0.2`. Studio's own Gradle JDK
# setting only covers builds launched from inside Studio, so without this line
# terminal builds silently disagree with IDE builds.
#
# Machine-specific path. If this project moves, change it or unset it and
# export JAVA_HOME instead.
org.gradle.java.home=C:/Users/kj638/.jdks/jbr-21.0.11
